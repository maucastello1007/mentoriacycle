<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>∞ Cycle — Mentorias</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#202020;font:15px system-ui}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #dadada;background:white;color:#202020;border-radius:9px;padding:10px 14px}button:hover{background:#f0f0f0}aside{position:fixed;width:240px;inset:0 auto 0 0;background:#111111;color:#eeeeee;padding:32px 22px}aside h1{font-size:38px;letter-spacing:-2px;margin:0}aside p{color:#b8b8b8;font-size:13px}aside button{width:100%;text-align:left;margin:6px 0;background:transparent;color:#f0f0f0;border-color:#444444}aside button.active{background:#dddddd;color:#111111}main{margin-left:240px;padding:40px;max-width:1500px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h2{font-size:32px;letter-spacing:-1px;margin:8px 0}h3{margin-top:0}.muted{color:#787878}.tag{font-size:12px;color:#555555;letter-spacing:2px;text-transform:uppercase}.primary{background:#111111;color:white;border:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:30px 0 12px}.tabs button.active{background:#dddddd;border-color:#aaaaaa}.card{background:white;border:1px solid #e2e2e2;border-radius:15px;padding:24px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid .card{margin:0}textarea,input,select{border:1px solid #dddddd;border-radius:8px;padding:11px;background:#fcfcfc;color:#202020}textarea{width:100%;min-height:155px;resize:vertical}label{display:block;margin-bottom:10px;font-weight:600}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row input[type=text]{flex:1;min-width:150px}.task{padding:14px 0;border-bottom:1px solid #eeeeee;display:flex;align-items:center;gap:12px}.task span{flex:1}.task small{color:#757575}.empty{text-align:center;padding:34px 15px;color:#828282}.foot{position:absolute;bottom:28px;font-size:12px;color:#b8b8b8;max-width:195px}.banner{background:#e9e9e9;padding:14px 18px;border-radius:10px;margin-top:25px;font-size:13px}@media(max-width:850px){aside{position:relative;width:100%;padding:20px}.foot{display:none}main{margin:0;padding:22px}.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}aside button{width:auto;margin-right:6px}}
.drive-link{display:inline-block;margin-top:18px;padding:10px 14px;background:#e9e9e9;color:#111111;border-radius:9px;text-decoration:none}.drive-link:hover{background:#dddddd}@media(max-width:650px){.task{flex-wrap:wrap}.task>div:first-child{min-width:100%}} .cycle-logo{position:relative;display:block;width:100%;max-width:230px;aspect-ratio:4.5;overflow:hidden;background:#111}.cycle-logo img{position:absolute;left:50%;top:50%;width:160%;max-width:none;height:auto;transform:translate(-50%,-50%);filter:grayscale(1) contrast(8)}input{accent-color:#111}:is(button,a,input,select,textarea):focus-visible{outline:2px solid #888;outline-offset:3px}</style></head><body><aside><a class="cycle-logo" href="/" aria-label="Cycle — voltar aos leads"><img src="/cycle-logo.png" alt="Cycle"></a><p>Seu espaço de mentoria</p><div id="nav"></div><div class="foot">Um método em construção.<br>Um espaço para evoluir com você.</div></aside><main id="app"></main><script>
const base=['Diagnóstico','Plano individual','Materiais de divulgação','Pré-lançamento / Buzz','Lançamento','Execução dos protocolos'];const uid=()=>crypto.randomUUID();const stage=n=>({id:uid(),name:n,goal:'',notes:'',tasks:[]});let state;try{state=JSON.parse(localStorage.getItem('cycle-v1'))}catch{}state??={model:base.map(stage),people:[]};let view='model',person=null,selected=state.model[0]?.id;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('cycle-v1',JSON.stringify(state))}function stages(){return view==='model'?state.model:state.people.find(p=>p.id===person)?.stages||[]}function current(){return stages().find(s=>s.id===selected)||stages()[0]}function go(v,p){view=v;person=p;selected=stages()[0]?.id;render()}function render(){document.getElementById('nav').innerHTML=`<button class="${view==='model'?'active':''}" onclick="go('model')">◇ Modelo da Cycle</button><button class="${view==='people'?'active':''}" onclick="go('people')">♧ Mentorados</button><button class="${view==='tasks'?'active':''}" onclick="go('tasks')">✓ Todas as tarefas</button>`;let html=`<header><div><div class="tag">Organização das mentorias</div><h2>${view==='model'?'Seu método, no seu ritmo.':view==='people'?'Mentorados':view==='tasks'?'Todas as tarefas':esc(state.people.find(p=>p.id===person)?.name||'')}</h2><div class="muted">${view==='model'?'Estruture a Cycle e adapte cada acompanhamento.':'Cada próximo passo, no mesmo lugar.'}</div></div><div class="row"><button onclick="backup()">Exportar backup</button><button class="primary" onclick="addPerson()">+ Novo mentorado</button></div></header>`;
if(view==='people'){html+=state.people.length?state.people.map(p=>`<div class="card row"><div style="flex:1"><h3>${esc(p.name)}</h3><span class="muted">${p.stages.length} etapas • ${p.stages.flatMap(s=>s.tasks).filter(t=>!t.done).length} tarefas pendentes</span></div><button onclick="go('person','${p.id}')">Abrir acompanhamento →</button></div>`).join(''):'<div class="card empty">Nenhum mentorado ainda. Adicione o primeiro quando quiser.</div>'}
else if(view==='tasks'){let count=0;html+='<div class="card">';for(const p of state.people)for(const s of p.stages)for(const t of s.tasks){count++;html+=`<div class="task"><input aria-label="Concluir tarefa" type="checkbox" ${t.done?'checked':''} onchange="toggle('${s.id}','${t.id}','${p.id}')"><span>${esc(t.title)}<br><small>${esc(p.name)} · ${esc(s.name)} · ${esc(t.owner)} ${t.date?'· '+esc(t.date):''}</small></span><button onclick="go('person','${p.id}')">Abrir</button></div>`}if(!count)html+='<div class="empty">As tarefas dos mentorados aparecerão aqui.</div>';html+='</div>'}
else{const ss=stages(),s=current();html+=`<div class="banner">${view==='model'?'Este modelo será copiado ao criar um mentorado. Alterações posteriores no modelo preservam os planos já criados.':'Este plano é individual. Você pode adaptar suas etapas e tarefas.'}</div><div class="tabs">${ss.map((s,i)=>`<button draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${s.id}')" ondragover="event.preventDefault()" ondrop="drop(event,'${s.id}')" class="${current()?.id===s.id?'active':''}" onclick="selected='${s.id}';render()">${i+1}. ${esc(s.name)}</button>`).join('')}<button onclick="addStage()">+ Etapa</button></div><p class="muted" style="font-size:12px">Arraste as abas para mudar a ordem ou use as setas abaixo.</p>`;if(s)html+=`<div class="card"><div class="row"><h3 style="flex:1;margin:0">${esc(s.name)}</h3><button aria-label="Mover etapa para esquerda" onclick="move(-1)">←</button><button aria-label="Mover etapa para direita" onclick="move(1)">→</button><button onclick="rename()">Renomear</button><button onclick="removeStage()">Remover</button></div></div><div class="grid"><div class="card"><label for="goal">Objetivo da etapa</label><textarea id="goal" placeholder="O que você deseja alcançar nesta etapa?" oninput="current().goal=this.value;save()">${esc(s.goal)}</textarea></div><div class="card"><label for="notes">Anotações e materiais</label><textarea id="notes" placeholder="Adicione decisões, anotações e links para materiais…" oninput="current().notes=this.value;save()">${esc(s.notes)}</textarea></div></div><div class="card"><h3>Tarefas e entregas</h3><div class="row"><input id="title" aria-label="Nova tarefa" type="text" placeholder="O que precisa ser feito?"><select id="owner" aria-label="Responsável"><option>Minha entrega</option><option>Tarefa do dentista</option></select><input id="date" aria-label="Prazo" type="date"><button class="primary" onclick="addTask()">+ Adicionar</button></div>${s.tasks.length?s.tasks.map(t=>`<div class="task"><input aria-label="Concluir tarefa" type="checkbox" ${t.done?'checked':''} onchange="toggle('${s.id}','${t.id}')"><span style="${t.done?'text-decoration:line-through':''}">${esc(t.title)}<br><small>${esc(t.owner)} ${t.date?'· '+esc(t.date):''}</small>${taskExtras(t)}</span><button onclick="editTask('${t.id}')">Editar</button><button aria-label="Remover tarefa" onclick="current().tasks=current().tasks.filter(t=>t.id!=='${t.id}');save();render()">×</button></div>`).join(''):'<div class="empty">Um espaço em branco para suas próximas ideias.<br>Adicione as tarefas quando estiver pronto.</div>'}</div>`}if(current() && (view==='model'||view==='person'))html+=renderDiagnostic(current());document.getElementById('app').innerHTML=html}
async function addPerson(){let n=await cyclePrompt('Nome do dentista');if(!n?.trim())return;let p={id:uid(),name:n.trim(),stages:structuredClone(state.model).map(s=>({...s,id:uid(),tasks:s.tasks.map(t=>blankSharedTask(t))}))};state.people.push(p);save();go('person',p.id)}async function addStage(){let n=await cyclePrompt('Nome da nova etapa');if(!n?.trim())return;let s=stage(n.trim());stages().push(s);selected=s.id;save();render()}async function rename(){let n=await cyclePrompt('Nome da etapa',current().name);if(n?.trim()){current().name=n.trim();save();render()}}async function removeStage(){if(!await cycleConfirm('Remover esta etapa e seu conteúdo?'))return;let a=stages(),i=a.indexOf(current());a.splice(i,1);selected=a[0]?.id;save();render()}function move(d){let a=stages(),i=a.indexOf(current()),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}function drop(e,id){e.preventDefault();let a=stages(),from=a.findIndex(s=>s.id===e.dataTransfer.getData('text/plain')),to=a.findIndex(s=>s.id===id);if(from<0||to<0)return;a.splice(to,0,a.splice(from,1)[0]);save();render()}function addTask(){let title=document.getElementById('title').value.trim();if(!title)return;current().tasks.push({id:uid(),title,owner:document.getElementById('owner').value,date:document.getElementById('date').value,done:false});save();render()}async function editTask(id){let t=current().tasks.find(t=>t.id===id),n=await cyclePrompt('Editar tarefa',t.title);if(n?.trim()){t.title=n.trim();save();render()}}function toggle(sid,tid,pid){let a=pid?state.people.find(p=>p.id===pid).stages:stages();let t=a.find(s=>s.id===sid).tasks.find(t=>t.id===tid);t.done=!t.done;save();render()}function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='cycle-backup.json';a.click();URL.revokeObjectURL(a.href)}
</script><script src="dialogs.js"></script><script src="diagnostic.js"></script><script src="mentee.js"></script><script src="prelaunch.js"></script><script src="task-files.js"></script><script src="sales.js"></script><script src="shared-tasks.js"></script><script>render();</script></body></html>
